name: NDPass
options:
  bundleIdPrefix: com.gios
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.4.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
targets:
  NDPass:
    type: application
    platform: iOS
    sources:
      - path: NDPass
      - path: Shared
    dependencies:
      - target: NDPassShare
      - target: NDPassWidgets
    entitlements:
      path: NDPass/NDPass.entitlements
      properties:
        com.apple.security.application-groups: [group.com.gios.ndpass]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.gios.ndpass"]
    info:
      path: NDPass/Info.plist
      properties:
        CFBundleDisplayName: NDPass
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: NDPass photographs your ticket stubs and reads them.
        NSPhotoLibraryUsageDescription: NDPass imports ticket photos and screenshots you pick.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        LSApplicationQueriesSchemes: [comgooglemaps]
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.gios.ndpass
            CFBundleURLSchemes: [ndpass]
        UIAppFonts: [InstrumentSerif-Regular.ttf, InstrumentSerif-Italic.ttf, Geist.ttf, GeistMono.ttf]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gios.ndpass
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  NDPassShare:
    type: app-extension
    platform: iOS
    sources:
      - path: NDPassShare
      - path: Shared
        excludes: [Countdown.swift]
      - path: NDPass/Model
      - path: NDPass/Logic
      - path: NDPass/Services
        excludes: [LiveCountdown.swift, ExpoImport.swift]
      - path: NDPass/UI/Theme.swift
      - path: NDPass/Resources/Geist.ttf
      - path: NDPass/Resources/GeistMono.ttf
      - path: NDPass/Resources/InstrumentSerif-Regular.ttf
      - path: NDPass/Resources/InstrumentSerif-Italic.ttf
    entitlements:
      path: NDPassShare/NDPassShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.gios.ndpass]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.gios.ndpass"]
    info:
      path: NDPassShare/Info.plist
      properties:
        CFBundleDisplayName: NDPass
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [InstrumentSerif-Regular.ttf, InstrumentSerif-Italic.ttf, Geist.ttf, GeistMono.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 5
              NSExtensionActivationSupportsFileWithMaxCount: 5
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gios.ndpass.NDPassShare
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) NDPASS_EXTENSION"
        SKIP_INSTALL: YES
  NDPassWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: NDPassWidgets
      - path: Shared/Countdown.swift
      - path: Shared/StubGradient.swift
      - path: NDPass/Resources/Geist.ttf
      - path: NDPass/Resources/GeistMono.ttf
      - path: NDPass/Resources/InstrumentSerif-Regular.ttf
    entitlements:
      path: NDPassWidgets/NDPassWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.gios.ndpass]
    info:
      path: NDPassWidgets/Info.plist
      properties:
        CFBundleDisplayName: NDPass
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [InstrumentSerif-Regular.ttf, Geist.ttf, GeistMono.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gios.ndpass.NextShowingWidget
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  NDPassTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NDPassTests
    dependencies:
      - target: NDPass
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gios.ndpass.tests
  NDPassUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NDPassUITests
    dependencies:
      - target: NDPass
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gios.ndpass.uitests
        TEST_TARGET_NAME: NDPass
schemes:
  NDPassScreenshots:
    build:
      targets:
        NDPass: all
        NDPassUITests: [test]
    test:
      targets:
        - NDPassUITests
  NDPass:
    build:
      targets:
        NDPass: all
        NDPassTests: [test]
    test:
      targets:
        - NDPassTests
